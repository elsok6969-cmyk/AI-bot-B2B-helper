[project]
name = "mynota-client-assistant"
version = "0.1.0"
description = "Telegram bot for managing B2B clients with Claude-driven insights"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mynota" }]
dependencies = [
    "aiogram>=3.13.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.4",
    "psycopg[binary]>=3.1",
    "dateparser>=1.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "freezegun>=1.5",
    "pre-commit>=3.5",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# UP042: enum.StrEnum suggestion — keeping `str, enum.Enum` for SQLAlchemy
#        native enum compatibility across the codebase.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
